<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-labelledby="t d" fill="#24261f">
  <title id="t">Keep talking while Claude works</title>
  <desc id="d">A timeline. You start a literature search and a test run in the background, then keep sending messages; the main thread answers each one, Stop ends only the current reply, and the background work keeps running until it is done and reports back.</desc>
  <style>
  .sans { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
  .flow { stroke-dasharray: 4 7; animation: flow 1.4s linear infinite; }
  .pulse { animation: pulse 1.6s ease-in-out infinite; }
  .pulse2 { animation: pulse 1.6s ease-in-out .8s infinite; }
  .cursor { animation: blink 1.1s steps(1) infinite; }
  .swipe { animation: swipe 9s ease-in-out infinite; }
  @keyframes flow { to { stroke-dashoffset: -22; } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .2; } }
  @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  @keyframes swipe {
    0%, 18% { transform: translateX(0); }
    25%, 43% { transform: translateX(43.5px); }
    50%, 68% { transform: translateX(83px); }
    75%, 93% { transform: translateX(121.5px); }
    100% { transform: translateX(0); }
  }
  .playhead { animation: playhead 14s linear infinite; }
  @keyframes playhead { from { transform: translateX(0); } to { transform: translateX(900px); } }
  @media (prefers-reduced-motion: reduce) {
    .flow, .pulse, .pulse2, .cursor, .swipe, .playhead { animation: none; }
  }</style>
  
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="1.1" fill="rgba(20,22,20,0.11)"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6f726a"/>
    </marker>
  </defs>
  <rect width="1280" height="460" fill="#ebebe8"/>
  <rect width="1280" height="460" fill="url(#dots)"/>
  <polygon points="20,20 1242,20 1260,38 1260,440 38,440 20,422" fill="none" stroke="#c7c8c0"/>
  <text class="mono" x="60" y="70" font-size="13" letter-spacing="2.6" fill="#b8793c">KEEP TALKING WHILE CLAUDE WORKS</text>
  
    <text class="mono" x="60" y="148" font-size="11.5" letter-spacing="1.6" fill="#111312">YOU</text>
    <text class="sans" x="60" y="165" font-size="12.5" fill="#6f726a">from your phone</text>
    <line x1="300" y1="150" x2="1200" y2="150" stroke="#c7c8c0" stroke-dasharray="2 6"/>
  
    <text class="mono" x="60" y="223" font-size="11.5" letter-spacing="1.6" fill="#111312">MAIN THREAD</text>
    <text class="sans" x="60" y="240" font-size="12.5" fill="#6f726a">answers right away</text>
    <line x1="300" y1="225" x2="1200" y2="225" stroke="#c7c8c0" stroke-dasharray="2 6"/>
  
    <text class="mono" x="60" y="298" font-size="11.5" letter-spacing="1.6" fill="#111312">SUBAGENT</text>
    <text class="sans" x="60" y="315" font-size="12.5" fill="#6f726a">literature search</text>
    <line x1="300" y1="300" x2="1200" y2="300" stroke="#c7c8c0" stroke-dasharray="2 6"/>
  
    <text class="mono" x="60" y="363" font-size="11.5" letter-spacing="1.6" fill="#111312">BACKGROUND TASK</text>
    <text class="sans" x="60" y="380" font-size="12.5" fill="#6f726a">test suite</text>
    <line x1="300" y1="365" x2="1200" y2="365" stroke="#c7c8c0" stroke-dasharray="2 6"/>
  
    <polygon points="372,288 1017,288 1022,293 1022,312 377,312 372,307" fill="#f4f4f1" stroke="#b8793c"/>
    <rect class="pulse" x="381" y="296" width="8" height="8" fill="#b8793c"/>
    <text class="mono" x="396" y="304" font-size="10" letter-spacing=".8" fill="#b8793c">RUNNING · NOT INTERRUPTED</text>
    <text class="mono" x="1030" y="304" font-size="10" letter-spacing=".8" fill="#4f7a4a">DONE</text>
  
    <polygon points="420,353 935,353 940,358 940,377 425,377 420,372" fill="#f4f4f1" stroke="#b8793c"/>
    <rect class="pulse2" x="429" y="361" width="8" height="8" fill="#b8793c"/>
    <text class="mono" x="444" y="369" font-size="10" letter-spacing=".8" fill="#b8793c">RUNNING</text>
    <text class="mono" x="948" y="369" font-size="10" letter-spacing=".8" fill="#4f7a4a">DONE</text>
  
    <rect x="325" y="145" width="10" height="10" fill="#b8793c"/>
    <text class="mono" x="330" y="134" font-size="10" letter-spacing=".8" text-anchor="middle" fill="#b8793c">START</text>
    <line class="flow" x1="330" y1="158" x2="330" y2="209" stroke="#6f726a" stroke-width="1.4" marker-end="url(#arrow)"/>
  
    <polygon points="318,212 409,212 414,217 414,238 323,238 318,233" fill="#e8d3b6" stroke="none"/>
    <text class="mono" x="327" y="229" font-size="10" letter-spacing=".8" fill="#24261f">PLAN</text>
  
    <rect x="495" y="145" width="10" height="10" fill="#b8793c"/>
    <text class="mono" x="500" y="134" font-size="10" letter-spacing=".8" text-anchor="middle" fill="#b8793c">ASK</text>
    <line class="flow" x1="500" y1="158" x2="500" y2="209" stroke="#6f726a" stroke-width="1.4" marker-end="url(#arrow)"/>
  
    <polygon points="488,212 579,212 584,217 584,238 493,238 488,233" fill="#e8d3b6" stroke="none"/>
    <text class="mono" x="497" y="229" font-size="10" letter-spacing=".8" fill="#24261f">ANSWER</text>
  
    <rect x="615" y="145" width="10" height="10" fill="#b8793c"/>
    <text class="mono" x="620" y="134" font-size="10" letter-spacing=".8" text-anchor="middle" fill="#b8793c">SEND NOW</text>
    <line class="flow" x1="620" y1="158" x2="620" y2="209" stroke="#6f726a" stroke-width="1.4" marker-end="url(#arrow)"/>
  
    <polygon points="608,212 707,212 712,217 712,238 613,238 608,233" fill="#e8d3b6" stroke="none"/>
    <text class="mono" x="617" y="229" font-size="10" letter-spacing=".8" fill="#24261f">READS IT NOW</text>
  
    <polygon points="726,212 797,212 802,217 802,238 731,238 726,233" fill="#ebebe8" stroke="#b8793c"/>
    <text class="mono" x="735" y="229" font-size="10" letter-spacing=".8" fill="#24261f">STOPPED</text>
  
    <rect x="785" y="145" width="10" height="10" fill="#111312"/>
    <text class="mono" x="790" y="134" font-size="10" letter-spacing=".8" text-anchor="middle" fill="#111312">STOP</text>
    <line class="flow" x1="790" y1="158" x2="790" y2="209" stroke="#6f726a" stroke-width="1.4" marker-end="url(#arrow)"/>
  
    <rect x="900" y="145" width="10" height="10" fill="#b8793c"/>
    <text class="mono" x="905" y="134" font-size="10" letter-spacing=".8" text-anchor="middle" fill="#b8793c">ASK</text>
    <line class="flow" x1="905" y1="158" x2="905" y2="209" stroke="#6f726a" stroke-width="1.4" marker-end="url(#arrow)"/>
  
    <polygon points="893,212 984,212 989,217 989,238 898,238 893,233" fill="#e8d3b6" stroke="none"/>
    <text class="mono" x="902" y="229" font-size="10" letter-spacing=".8" fill="#24261f">ANSWER</text>
  <line class="flow" x1="1030" y1="286" x2="1060" y2="241" stroke="#4f7a4a" stroke-width="1.4" marker-end="url(#arrow)"/>
  
    <polygon points="1060,212 1175,212 1180,217 1180,238 1065,238 1060,233" fill="#e8d3b6" stroke="none"/>
    <text class="mono" x="1069" y="229" font-size="10" letter-spacing=".8" fill="#24261f">REPORTS BACK</text>
  <g class="playhead"><line x1="300" y1="116" x2="300" y2="389" stroke="#b8793c" stroke-width="1.2" opacity=".55"/></g>
  <g class="sans" font-size="15">
    <text x="60" y="420">Background work keeps running through every message. Stop ends only the current reply.</text>
  </g>
</svg>

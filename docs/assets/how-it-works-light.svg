<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="t d" fill="#24261f">
  <title id="t">How CloudCLI-MobileUI works</title>
  <desc id="d">Your phone talks to the CloudCLI-MobileUI server on your workstation over your own network; the server runs Claude Code, which works on your project. Background agents keep running while you chat.</desc>
  <style>
  .sans { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
  .flow { stroke-dasharray: 4 7; animation: flow 1.4s linear infinite; }
  .pulse { animation: pulse 1.6s ease-in-out infinite; }
  .pulse2 { animation: pulse 1.6s ease-in-out .8s infinite; }
  .cursor { animation: blink 1.1s steps(1) infinite; }
  .swipe { animation: swipe 9s ease-in-out infinite; }
  @keyframes flow { to { stroke-dashoffset: -22; } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .2; } }
  @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  @keyframes swipe {
    0%, 18% { transform: translateX(0); }
    25%, 43% { transform: translateX(43.5px); }
    50%, 68% { transform: translateX(83px); }
    75%, 93% { transform: translateX(121.5px); }
    100% { transform: translateX(0); }
  }
  .playhead { animation: playhead 14s linear infinite; }
  @keyframes playhead { from { transform: translateX(0); } to { transform: translateX(900px); } }
  @media (prefers-reduced-motion: reduce) {
    .flow, .pulse, .pulse2, .cursor, .swipe, .playhead { animation: none; }
  }</style>
  
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="1.1" fill="rgba(20,22,20,0.11)"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6f726a"/>
    </marker>
  </defs>
  <rect width="1280" height="440" fill="#ebebe8"/>
  <rect width="1280" height="440" fill="url(#dots)"/>
  <polygon points="20,20 1242,20 1260,38 1260,420 38,420 20,402" fill="none" stroke="#c7c8c0"/>
  <text class="mono" x="60" y="66" font-size="13" letter-spacing="2.6" fill="#b8793c">HOW IT WORKS</text>
  
    <polygon points="60,100 258,100 270,112 270,250 72,250 60,238" fill="#f4f4f1" stroke="#c7c8c0" stroke-width="1"/>
    <rect x="86" y="122" width="16" height="28" rx="3" fill="none" stroke="#111312" stroke-width="1.6"/><line x1="91" y1="146" x2="97" y2="146" fill="none" stroke="#111312" stroke-width="1.6"/>
    <text class="sans" x="80" y="184" font-size="19" font-weight="700" fill="#111312">Your phone</text>
    <text class="sans" x="80" y="208" font-size="13" fill="#6f726a">Any browser, or</text>
    <text class="sans" x="80" y="226" font-size="13" fill="#6f726a">the home-screen app</text>
    <polygon points="380,100 578,100 590,112 590,250 392,250 380,238" fill="#f4f4f1" stroke="#b8793c" stroke-width="1.6"/>
    <rect x="400" y="122" width="28" height="8" fill="none" stroke="#111312" stroke-width="1.6"/><rect x="422" y="125" width="2" height="2" fill="#b8793c"/><rect x="400" y="132" width="28" height="8" fill="none" stroke="#111312" stroke-width="1.6"/><rect x="422" y="135" width="2" height="2" fill="#b8793c"/><rect x="400" y="142" width="28" height="8" fill="none" stroke="#111312" stroke-width="1.6"/><rect x="422" y="145" width="2" height="2" fill="#b8793c"/>
    <text class="sans" x="400" y="184" font-size="16.5" font-weight="700" fill="#111312">CloudCLI-MobileUI</text>
    <text class="sans" x="400" y="208" font-size="13" fill="#6f726a">Runs on your</text>
    <text class="sans" x="400" y="226" font-size="13" fill="#6f726a">workstation (Node.js)</text>
    <polygon points="700,100 898,100 910,112 910,250 712,250 700,238" fill="#f4f4f1" stroke="#c7c8c0" stroke-width="1"/>
    <rect x="720" y="124" width="28" height="24" fill="none" stroke="#111312" stroke-width="1.6"/><text class="mono" x="724" y="141" font-size="11" fill="#b8793c">&gt;_</text>
    <text class="sans" x="720" y="184" font-size="19" font-weight="700" fill="#111312">Claude Code</text>
    <text class="sans" x="720" y="208" font-size="13" fill="#6f726a">Same CLI, same login,</text>
    <text class="sans" x="720" y="226" font-size="13" fill="#6f726a">same sessions</text>
    <polygon points="1020,100 1218,100 1230,112 1230,250 1032,250 1020,238" fill="#f4f4f1" stroke="#c7c8c0" stroke-width="1"/>
    <path d="M1040 126 h10 l3 4 h15 v18 h-28 z" fill="none" stroke="#111312" stroke-width="1.6"/>
    <text class="sans" x="1040" y="184" font-size="19" font-weight="700" fill="#111312">Your project</text>
    <text class="sans" x="1040" y="208" font-size="13" fill="#6f726a">Files, git and</text>
    <text class="sans" x="1040" y="226" font-size="13" fill="#6f726a">the terminal</text>
  
    <line class="flow" x1="276" y1="175" x2="374" y2="175" stroke="#6f726a" stroke-width="1.6" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text class="mono" x="325" y="163" font-size="10.5" letter-spacing="1.2" text-anchor="middle" fill="#6f726a">LAN · VPN</text>
  
    <line class="flow" x1="596" y1="175" x2="694" y2="175" stroke="#6f726a" stroke-width="1.6" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text class="mono" x="645" y="163" font-size="10.5" letter-spacing="1.2" text-anchor="middle" fill="#6f726a">STREAMS</text>
  
    <line class="flow" x1="916" y1="175" x2="1014" y2="175" stroke="#6f726a" stroke-width="1.6"  marker-end="url(#arrow)"/>
    <text class="mono" x="965" y="163" font-size="10.5" letter-spacing="1.2" text-anchor="middle" fill="#6f726a">READS · EDITS</text>
  <line x1="805" y1="250" x2="805" y2="280" stroke="#c7c8c0"/>
  
    <polygon points="700,280 904,280 910,286 910,310 706,310 700,304" fill="#e8d3b6" stroke="none"/>
    <rect class="" x="712" y="291" width="8" height="8" fill="#4f7a4a"/>
    <text class="mono" x="728" y="299.5" font-size="10.5" letter-spacing="1" fill="#24261f">MAIN THREAD · CHATTING</text>
  
    <polygon points="700,318 904,318 910,324 910,348 706,348 700,342" fill="#ebebe8" stroke="#b8793c"/>
    <rect class="pulse" x="712" y="329" width="8" height="8" fill="#b8793c"/>
    <text class="mono" x="728" y="337.5" font-size="10.5" letter-spacing="1" fill="#b8793c">SUBAGENT · RUNNING</text>
  
    <polygon points="700,356 904,356 910,362 910,386 706,386 700,380" fill="#ebebe8" stroke="#b8793c"/>
    <rect class="pulse2" x="712" y="367" width="8" height="8" fill="#b8793c"/>
    <text class="mono" x="728" y="375.5" font-size="10.5" letter-spacing="1" fill="#b8793c">SUBAGENT · RUNNING</text>
  <g class="sans" font-size="15">
    <text x="60" y="304">Your phone reaches the workstation over your own network.</text>
    <text x="60" y="328">Claude Code, your files and your login stay on the workstation.</text>
  </g>
  <text class="mono" x="60" y="372" font-size="11" letter-spacing="1.4" fill="#b8793c">NEW · KEEP TALKING WHILE BACKGROUND AGENTS RUN  →</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="t d" fill="#e2e3dc">
  <title id="t">CloudCLI-MobileUI</title>
  <desc id="d">A workstation running Claude Code with two background agents, connected over LAN or VPN to a phone showing the conversation.</desc>
  <style>
  .sans { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
  .flow { stroke-dasharray: 4 7; animation: flow 1.4s linear infinite; }
  .pulse { animation: pulse 1.6s ease-in-out infinite; }
  .pulse2 { animation: pulse 1.6s ease-in-out .8s infinite; }
  .cursor { animation: blink 1.1s steps(1) infinite; }
  .swipe { animation: swipe 9s ease-in-out infinite; }
  @keyframes flow { to { stroke-dashoffset: -22; } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .2; } }
  @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  @keyframes swipe {
    0%, 18% { transform: translateX(0); }
    25%, 43% { transform: translateX(43.5px); }
    50%, 68% { transform: translateX(83px); }
    75%, 93% { transform: translateX(121.5px); }
    100% { transform: translateX(0); }
  }
  .playhead { animation: playhead 14s linear infinite; }
  @keyframes playhead { from { transform: translateX(0); } to { transform: translateX(900px); } }
  @media (prefers-reduced-motion: reduce) {
    .flow, .pulse, .pulse2, .cursor, .swipe, .playhead { animation: none; }
  }</style>
  
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="1.1" fill="rgba(232,232,226,0.07)"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ba09a"/>
    </marker>
  </defs>
  <rect width="1280" height="560" fill="#0f1112"/>
  <rect width="1280" height="560" fill="url(#dots)"/>
  <polygon points="20,20 1242,20 1260,38 1260,540 38,540 20,522" fill="none" stroke="#2b302f"/>
  <text class="mono" x="72" y="168" font-size="13.5" letter-spacing="2.6" fill="#d9a25f">A MOBILE-FIRST EDITION OF CLOUDCLI</text>
  <text class="sans" x="70" y="236" font-size="58" font-weight="700" letter-spacing="-1" fill="#f1f1ea">CloudCLI-MobileUI</text>
  <text class="sans" x="72" y="290" font-size="23">Run Claude Code on your own computer.</text>
  <text class="sans" x="72" y="324" font-size="23">Keep working with it from your phone.</text>
  
    <polygon points="72,372 193,372 200,379 200,406 79,406 72,399" fill="#161919" stroke="#2b302f"/>
    <text class="mono" x="136" y="394" font-size="12.5" letter-spacing="1.4" text-anchor="middle" fill="#e2e3dc">SWIPE TABS</text>
  
    <polygon points="212,372 401,372 408,379 408,406 219,406 212,399" fill="#161919" stroke="#2b302f"/>
    <text class="mono" x="310" y="394" font-size="12.5" letter-spacing="1.4" text-anchor="middle" fill="#e2e3dc">BACKGROUND AGENTS</text>
  
    <polygon points="420,372 497,372 504,379 504,406 427,406 420,399" fill="#161919" stroke="#2b302f"/>
    <text class="mono" x="462" y="394" font-size="12.5" letter-spacing="1.4" text-anchor="middle" fill="#e2e3dc">SKINS</text>
  <text class="mono" x="72" y="466" font-size="11.5" letter-spacing="1.6" fill="#9ba09a">CLOUDCLI BY SITEBOON AI &amp; CONTRIBUTORS · AGPL-3.0</text>
  
  <polygon points="680,170 968,170 980,182 980,366 692,366 680,354" fill="#161919" stroke="#2b302f"/>
  <rect x="694" y="184" width="272" height="150" fill="#0b0c0d"/>
  <g class="mono" font-size="12.5">
    <text x="712" y="210" fill="#e2e3dc"><tspan fill="#d9a25f">$</tspan> claude</text>
    
    <rect class="" x="712" y="232" width="8" height="8" fill="#8fbf7a"/>
    <text x="726" y="240" fill="#e2e3dc">main</text>
    <text x="810" y="240" fill="#9ba09a">talking to phone</text>
    
    <rect class="pulse" x="712" y="256" width="8" height="8" fill="#d9a25f"/>
    <text x="726" y="264" fill="#e2e3dc">agent 1</text>
    <text x="810" y="264" fill="#9ba09a">literature search</text>
    
    <rect class="pulse2" x="712" y="280" width="8" height="8" fill="#d9a25f"/>
    <text x="726" y="288" fill="#e2e3dc">agent 2</text>
    <text x="810" y="288" fill="#9ba09a">test suite</text>
    <text x="712" y="316" fill="#d9a25f">$</text>
    <rect class="cursor" x="724" y="306" width="8" height="13" fill="#e2e3dc"/>
  </g>
  <rect x="810" y="366" width="40" height="22" fill="#2b302f"/>
  <rect x="770" y="388" width="120" height="7" rx="3.5" fill="#2b302f"/>
  <text class="mono" x="830" y="430" font-size="11" letter-spacing="1.8" text-anchor="middle" fill="#9ba09a">YOUR WORKSTATION</text>
  <path class="flow" d="M 900 168 C 930 70, 1030 62, 1080 118" fill="none" stroke="#d9a25f" stroke-width="2"/>
  <text class="mono" x="985" y="72" font-size="11" letter-spacing="1.8" text-anchor="middle" fill="#d9a25f">LAN · VPN</text>
  
  <g fill="#e2e3dc">
  <rect x="1030" y="120" width="200" height="400" rx="30" fill="#2b302f"/>
  <rect x="1040" y="130" width="180" height="380" rx="22" fill="#161919"/>
  <rect x="1100" y="138" width="60" height="12" rx="6" fill="#2b302f"/>
  <g class="mono" font-size="9" letter-spacing="1" font-weight="600">
    <text x="1052" y="172" fill="#9ba09a">CHAT</text>
    <text x="1092" y="172" fill="#9ba09a">FILES</text>
    <text x="1138" y="172" fill="#9ba09a">GIT</text>
    <text x="1170" y="172" fill="#9ba09a">SHELL</text>
  </g>
  <g class="swipe"><rect x="1054" y="178" width="22" height="2" fill="#d9a25f"/></g>
  <line x1="1048" y1="186" x2="1212" y2="186" stroke="#2b302f"/>
  <polygon points="1092,198 1202,198 1208,204 1208,232 1098,232 1092,226" fill="#3a3226"/>
  <g class="sans" font-size="10">
    <text x="1100" y="213">Run the test suite</text>
    <text x="1100" y="226">and fix what fails</text>
  </g>
  <rect x="1052" y="244" width="150" height="6" rx="3" fill="#2b302f"/>
  <rect x="1052" y="256" width="128" height="6" rx="3" fill="#2b302f"/>
  <rect x="1052" y="268" width="96" height="6" rx="3" fill="#2b302f"/>
  <polygon points="1052,284 1202,284 1208,290 1208,332 1058,332 1052,326" fill="#0f1112" stroke="#d9a25f"/>
  <rect class="pulse" x="1062" y="296" width="8" height="8" fill="#d9a25f"/>
  <text class="mono" x="1076" y="303" font-size="8.5" letter-spacing=".8" fill="#d9a25f">SUBAGENT · RUNNING</text>
  <text class="sans" x="1062" y="322" font-size="10">literature search</text>
  <rect x="1052" y="346" width="146" height="6" rx="3" fill="#2b302f"/>
  <rect x="1052" y="358" width="118" height="6" rx="3" fill="#2b302f"/>
  <polygon points="1052,378 1202,378 1208,384 1208,408 1058,408 1052,402" fill="#0f1112" stroke="#2b302f"/>
  <rect x="1062" y="389" width="8" height="8" fill="#8fbf7a"/>
  <text class="mono" x="1076" y="396.5" font-size="8.5" letter-spacing=".8" fill="#8fbf7a">TESTS · 24 PASSED</text>
  <rect x="1052" y="422" width="140" height="6" rx="3" fill="#2b302f"/>
  <rect x="1052" y="434" width="100" height="6" rx="3" fill="#2b302f"/>
  <polygon points="1052,462 1202,462 1208,468 1208,494 1058,494 1052,488" fill="#0f1112" stroke="#2b302f"/>
  <text class="sans" x="1062" y="482" font-size="10" fill="#9ba09a">Message</text>
  <rect x="1184" y="470" width="16" height="16" fill="#d9a25f"/>
  </g>
</svg>
